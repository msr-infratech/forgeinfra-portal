name: Deploy forgeinfra-portal

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Clone si premier déploiement, sinon pull
            if [ ! -d /opt/forgeinfra/portal ]; then
              mkdir -p /opt/forgeinfra/portal
              git clone https://github.com/msr-infratech/forgeinfra-portal /opt/forgeinfra/portal
            fi

            cd /opt/forgeinfra/portal
            git pull origin main

            # Créer le réseau Docker si absent
            docker network inspect forgeinfra >/dev/null 2>&1 || docker network create forgeinfra

            # Rebuild et restart
            docker compose build portal
            docker compose up -d --no-deps portal
            docker image prune -f

            echo "✓ Portal deployed at $(date)"